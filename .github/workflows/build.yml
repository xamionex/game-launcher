name: Build

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

env:
  LEGION_REPO: brcly/legion-kvm
  LEGION_COMMIT: 0197712f1a12ce70411d575b33306349c7b19c37

jobs:
  build:
    name: Build (linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      # Zig is used for glibc compatibility so the binary runs on SteamOS.
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.28

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-linux
          path: target/x86_64-unknown-linux-gnu/release/game

  legion:
    name: Build Legion (linux)
    runs-on: ubuntu-latest
    # The first build compiles QEMU, Mesa, the guest kernel and the Rust tools.
    timeout-minutes: 360

    steps:
      # Legion's first build needs at least 25 GiB. Fail early instead of hours into the build, without deleting the runner's toolchains.
      - name: Check disk space
        run: |
          df -h /
          available_kib=$(df -Pk / | awk 'NR == 2 { print $4 }')
          required_kib=$((25 * 1024 * 1024))
          if [ "$available_kib" -lt "$required_kib" ]; then
            echo "::error::Legion needs at least 25 GiB free, found $((available_kib / 1024 / 1024)) GiB"
            exit 1
          fi

      - name: Checkout Legion
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LEGION_REPO }}
          ref: ${{ env.LEGION_COMMIT }}
          path: legion

      # Source archives are checksum-verified, so a stale cache fails loudly instead of corrupting a build.
      - name: Cache Legion sources
        uses: actions/cache@v4
        with:
          path: legion/build/cache
          key: legion-sources-${{ env.LEGION_COMMIT }}-${{ hashFiles('legion/config/sources.json') }}

      - name: Build Legion
        working-directory: legion
        run: python3 tools/build.py --jobs "$(nproc)"

      - name: Smoke test the packaged executable
        working-directory: legion
        run: |
          test -x build/dist/legion
          ./build/dist/legion --version

      - name: Collect the release files
        working-directory: legion
        run: |
          mkdir -p release
          cp build/dist/legion release/legion
          cp LICENSE release/LEGION-LICENSE
          cp NOTICE release/LEGION-NOTICE
          {
            printf 'legion is licensed under AGPL-3.0-only.\n'
            printf 'Source: https://github.com/%s/tree/%s\n' "$LEGION_REPO" "$LEGION_COMMIT"
          } > release/LEGION-SOURCE.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: legion-linux
          path: |
            legion/release/legion
            legion/release/LEGION-LICENSE
            legion/release/LEGION-NOTICE
            legion/release/LEGION-SOURCE.txt

  release:
    name: Publish Release
    needs: [ build, legion ]
    runs-on: ubuntu-latest

    steps:
      - name: Download game
        uses: actions/download-artifact@v4
        with:
          name: game-linux
          path: ./dist

      - name: Download Legion
        uses: actions/download-artifact@v4
        with:
          name: legion-linux
          path: ./dist

      - name: Write checksums
        working-directory: ./dist
        run: sha256sum game legion LEGION-LICENSE LEGION-NOTICE LEGION-SOURCE.txt > SHA256SUMS

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          body: |
            Legion KVM is bundled as a separate program and is licensed under AGPL-3.0-only.
            Source: https://github.com/${{ env.LEGION_REPO }}/tree/${{ env.LEGION_COMMIT }}
          files: |
            ./dist/game
            ./dist/legion
            ./dist/LEGION-LICENSE
            ./dist/LEGION-NOTICE
            ./dist/LEGION-SOURCE.txt
            ./dist/SHA256SUMS
          generate_release_notes: true
