[package]
name = "game-launcher"
version = "0.2.1"
edition = "2021"

[[bin]]
name = "game"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
dirs = "6.0.0"
libc = "0.2.186"
os_pipe = "1.2.3"
ratatui = "0.30.2"
regex = "1.12.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
toml_edit = "0.25.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
